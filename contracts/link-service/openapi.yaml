openapi: 3.1.0

info:
  title: Link Service API
  description: API for creating and managing shortened URLs. The health endpoint is currently implemented; business endpoints are planned.
  version: 1.0.0

servers:
  - url: http://localhost:3101
    description: Local development server

tags:
  - name: Health
    description: Service health monitoring
  - name: Links
    description: URL creation and management

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      description: Currently implemented endpoint used to verify that the Link Service is running.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: link-service
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/links:
    post:
      tags:
        - Links
      summary: Create a shortened URL
      description: Planned endpoint for creating a new short URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - originalUrl
              properties:
                originalUrl:
                  type: string
                  format: uri
                  example: https://example.com/articles/software-engineering
      responses:
        "201":
          description: Short URL created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          description: Invalid URL
        "409":
          description: Short code conflict
        "500":
          description: Internal server error

  /api/v1/links/{code}:
    get:
      tags:
        - Links
      summary: Retrieve link information
      description: Planned endpoint for retrieving information about a shortened URL.
      parameters:
        - name: code
          in: path
          required: true
          description: Unique short URL code
          schema:
            type: string
            example: abc123
      responses:
        "200":
          description: Link information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "404":
          description: Short URL not found
        "500":
          description: Internal server error

components:
  schemas:
    Link:
      type: object
      properties:
        id:
          type: string
          example: 673a1234567890abcdef1234
        code:
          type: string
          example: abc123
        originalUrl:
          type: string
          format: uri
          example: https://example.com/articles/software-engineering
        shortUrl:
          type: string
          format: uri
          example: http://localhost:3102/abc123
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - originalUrl
        - shortUrl
        - createdAt