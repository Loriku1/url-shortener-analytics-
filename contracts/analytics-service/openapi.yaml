openapi: 3.1.0

info:
  title: Analytics Service API
  description: API responsible for collecting and providing statistics about shortened URL activity. The health endpoint is currently implemented; analytics endpoints are planned.
  version: 1.0.0

servers:
  - url: http://localhost:3103
    description: Local development server

tags:
  - name: Health
    description: Service health monitoring
  - name: Analytics
    description: URL usage statistics

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      description: Currently implemented endpoint used to verify that the Analytics Service is running.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: analytics-service
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/analytics/{code}:
    get:
      tags:
        - Analytics
      summary: Retrieve URL analytics
      description: Planned endpoint for retrieving click statistics for a shortened URL.
      parameters:
        - name: code
          in: path
          required: true
          description: Unique short URL code
          schema:
            type: string
            example: abc123
        - name: from
          in: query
          required: false
          description: Start date for the analytics period
          schema:
            type: string
            format: date
            example: "2026-11-01"
        - name: to
          in: query
          required: false
          description: End date for the analytics period
          schema:
            type: string
            format: date
            example: "2026-11-11"
      responses:
        "200":
          description: Analytics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "400":
          description: Invalid date range or request parameters
        "404":
          description: Short URL not found
        "500":
          description: Internal server error

components:
  schemas:
    Analytics:
      type: object
      properties:
        code:
          type: string
          example: abc123
        totalClicks:
          type: integer
          minimum: 0
          example: 1250
        uniqueClicks:
          type: integer
          minimum: 0
          example: 980
        period:
          type: object
          properties:
            from:
              type: string
              format: date
              example: "2026-11-01"
            to:
              type: string
              format: date
              example: "2026-11-11"
        generatedAt:
          type: string
          format: date-time
      required:
        - code
        - totalClicks
        - uniqueClicks
        - generatedAt